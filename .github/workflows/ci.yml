name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zlint:
    name: Zig lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install verified zlint v0.10.0
        run: |
          curl --fail --location --silent --show-error https://github.com/DonIsaac/zlint/releases/download/v0.10.0/zlint-linux-x86_64 --output "$RUNNER_TEMP/zlint"
          echo "0b331646d5e40bec3cfcb0694c5da0b13b9de8b10af12937a777ab3144b70b65  $RUNNER_TEMP/zlint" | sha256sum --check
          chmod +x "$RUNNER_TEMP/zlint"
      - run: "$RUNNER_TEMP/zlint" --deny-warnings src

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig build.zig.zon src
      - run: zig build
      - run: zig build test
      - run: zig build test-transition
      - run: bash scripts/test_engine_local.sh
      - run: zig build api-test-server
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @usebruno/cli@4.3.0
      - run: bash scripts/test_beacon_api.sh

  engine-interop:
    name: Geth ${{ matrix.version }} interop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.17.7
            commit: 3d858f85
            sha256: d9973f609e44e97f4d55f8cb644586cabc2542096e1fcb1c7334a0cba00a89e8
          - version: v1.17.8
            commit: a5790770
            sha256: eb864b9ce79afac5e6f57ca10866eb65477b41be62cc8843b219c2ff11d49557
          - version: v1.17.9
            commit: 9dffe6e9
            sha256: 8d31b66ac0a7e23bc2dd7d220452b209aee4123bf2677d5d4cde4aead5480a25
          - version: v1.17.10
            commit: 1df30b18
            sha256: e016aca8cc391c8d5d14dc17c9af589488d99c37ed71d892213c80757935ba64
    steps:
      - uses: actions/checkout@v7
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - name: Install verified Geth binary
        run: |
          release="${{ matrix.version }}"
          release="${release#v}"
          archive="geth-linux-amd64-${release}-${{ matrix.commit }}.tar.gz"
          curl --fail --location --silent --show-error "https://gethstore.blob.core.windows.net/builds/$archive" --output "$RUNNER_TEMP/$archive"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/geth"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/geth"
          find "$RUNNER_TEMP/geth" -type f -name geth -exec cp {} "$RUNNER_TEMP/geth-bin" \;
          chmod +x "$RUNNER_TEMP/geth-bin"
          echo "GETH_BIN=$RUNNER_TEMP/geth-bin" >> "$GITHUB_ENV"
      - name: Geth ${{ matrix.version }} Engine API interoperability
        run: bash scripts/test_engine_interop.sh ${{ matrix.version }}

  discv5-interop:
    name: Geth discv5 interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/geth-discovery-probe/go.mod
          cache-dependency-path: scripts/geth-discovery-probe/go.sum
      - run: bash scripts/test_discv5_geth.sh

  prysm-p2p-interop:
    name: Prysm/Geth Fulu P2P interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/prysm-interop/blobtx/go.mod
          cache-dependency-path: scripts/prysm-interop/blobtx/go.sum
      - name: Install verified Geth and Prysm binaries
        run: |
          mkdir -p "$RUNNER_TEMP/prysm" "$RUNNER_TEMP/geth"
          archive=geth-linux-amd64-1.17.10-1df30b18.tar.gz
          curl --fail --location --silent --show-error "https://gethstore.blob.core.windows.net/builds/$archive" --output "$RUNNER_TEMP/$archive"
          echo "e016aca8cc391c8d5d14dc17c9af589488d99c37ed71d892213c80757935ba64  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/geth"
          find "$RUNNER_TEMP/geth" -type f -name geth -exec cp {} "$RUNNER_TEMP/geth-bin" \;
          for item in \
            beacon-chain:4e740bd2eabc98863607c649062f2e8720d4e12ccab28fc59ec6e84cbc90da3e \
            validator:1be08125b3ea8ecf8e59ebfa48dca77745a9c3a45b0fb390c5122a25e9adc39b \
            prysmctl:9abd90c15ad98b9dbfb288ddb436a3b803676021885e7b6ab1a16d2424831cc6; do
            name=${item%%:*}
            hash=${item#*:}
            curl --fail --location --silent --show-error "https://github.com/OffchainLabs/prysm/releases/download/v7.3.1/$name-v7.3.1-linux-amd64" --output "$RUNNER_TEMP/prysm/$name"
            echo "$hash  $RUNNER_TEMP/prysm/$name" | sha256sum --check
          done
          chmod +x "$RUNNER_TEMP/geth-bin" "$RUNNER_TEMP/prysm/"*
          echo "GETH_BIN=$RUNNER_TEMP/geth-bin" >> "$GITHUB_ENV"
          echo "PRYSM_BIN_DIR=$RUNNER_TEMP/prysm" >> "$GITHUB_ENV"
      - run: bash scripts/test_prysm_geth_interop.sh
        env:
          KEEP_INTEROP_DIR: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prysm-p2p-logs
          path: /tmp/hightower-prysm-geth.*/*.log
          retention-days: 3
